<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#1d2233;--sub:#5b6476;--blue:#1f6fd6;--line:#cdd5e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1c2333;--ink:#e8ecf5;--sub:#a3acc0;--blue:#6aa5ff;--line:#38425a}}
:root[data-theme="dark"]{--bg:#121722;--card:#1c2333;--ink:#e8ecf5;--sub:#a3acc0;--blue:#6aa5ff;--line:#38425a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding:16px}
.card{background:var(--card);border-radius:16px;padding:30px 26px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(20,40,90,.12);border-top:6px solid var(--blue)}
h1{font-size:1.2em;margin:0 0 8px}p{margin:0 0 16px;color:var(--sub);line-height:1.6;font-size:.95em}
form{display:flex;gap:8px}input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
#msg{min-height:1.4em;margin:10px 0 0;font-size:.9em;color:#d33}
</style></head><body>

async function open_(pw,quiet){
  var m=document.getElementById('msg'); if(!quiet) m.textContent='여는 중… (몇 초 걸립니다)';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.c)));

    document.open();document.write(html);document.close();
  }catch(e){ try{sessionStorage.removeItem('gwPw')}catch(_){} m.textContent=quiet?'':'비밀번호가 맞지 않습니다.'; }
}
